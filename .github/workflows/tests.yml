name: tests
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version to (re)create a missing release for, e.g. 0.45.8 (default: plugin.json)"
        required: false
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # plugin shape and the mod's specs, with Claude Code installed (neither command needs a sign-in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm i -g @anthropic-ai/claude-code@2.1.327
      - name: Validate the plugin
        run: claude plugin validate plugins/lean-agent
      - name: Shell hook spec
        run: sh plugins/lean-agent/hooks/rules-loaded.test.sh
      - name: Mod specs (*.test.ts, *.test.tsx)
        run: claude plugin test plugins/lean-agent
  release:
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eu
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            git rev-parse -q --verify "refs/tags/v$version" >/dev/null \
              || { echo "no tag v$version; dispatch only recreates releases for existing tags"; exit 1; }
            commit=$(git rev-list -n1 "v$version")
          else
            version=$(python3 -c 'import json; print(json.load(open("plugins/lean-agent/.claude-plugin/plugin.json"))["version"])')
            commit=$(git rev-parse HEAD)
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"; exit 0
          fi
          # the release API creates the tag: a tag pushed with the workflow token is refused when the commit
          # changes a workflow file (no `workflows` permission)
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$tag" | while read -r t; do
            git merge-base --is-ancestor "$t" "$commit" && { echo "$t"; break; }; done || true)
          range="${prev:+$prev..}$commit"
          {
            git log --reverse --no-merges --format='- %s' "$range"
            echo
            echo "Update: claude plugin update lean-agent"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$commit" --title "lean-agent $tag" --notes-file "$RUNNER_TEMP/notes.md"
