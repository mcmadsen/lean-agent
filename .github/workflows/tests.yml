name: tests
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version to (re)create a missing release for, e.g. 0.45.8 (default: plugin.json)"
        required: false
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }}, shard ${{ matrix.shard }}/4)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.9", "3.13", "3.14"]
        shard: [1, 2, 3, 4]
        exclude:  # macOS: only its system Python (3.9); 5 macOS jobs run at a time, so 4 shards fit one wave
          - os: macos-latest
            python: "3.13"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - if: matrix.shard == 1
        run: python tests/test_hooks.py
      - run: python tests/test_orchestrator.py
        env:
          LEAN_TEST_SHARD: ${{ matrix.shard }}/4
      - env:
          SHARD: ${{ matrix.shard }}
        run: i=0; for t in feedback goals spool stuck locks own_review deliver_guard poll startup_perf service_wait restart_loop orphan report_delivery runs_cli worktree_nopath tool_boundary restore fresh_delivery push_gate private private_switch runs_lost myq_ack runs_show_fast runs_show_active delta_effects perf load_guard worktree_reuse detach_tree runs_listing_fast undelivered_source resume_stdin; do if [ $((i % 4)) -eq $((SHARD - 1)) ]; then python tests/test_$t.py || exit 1; fi; i=$((i + 1)); done
      - if: matrix.shard == 1
        run: sh -n bin/lean-agent && sh -n plugins/lean-agent/bin/lean-agent && sh -n plugins/lean-agent/bin/lean-budget
      - name: ./install in a scratch home
        if: matrix.shard == 1
        run: |
          export T="$RUNNER_TEMP/home"; mkdir -p "$T"
          env -i HOME="$T" SHELL=/bin/zsh PATH=/usr/bin:/bin:"$(dirname "$(command -v python3)")" ./install --no-plugin
          grep -q "added by lean-agent ./install" "$T/.zshrc"
          env -i HOME="$T" PATH=/usr/bin:/bin:"$(dirname "$(command -v python3)")" sh -c ". \"$T/.zshrc\"; cd /; lean-agent home"
          env -i HOME="$T" SHELL=/bin/zsh PATH=/usr/bin:/bin ./install --uninstall
          ! grep -q "lean-agent" "$T/.zshrc"
  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the release if this version has none
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eu
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            git rev-parse -q --verify "refs/tags/v$version" >/dev/null \
              || { echo "no tag v$version; dispatch only recreates releases for existing tags"; exit 1; }
            commit=$(git rev-list -n1 "v$version")
          else
            version=$(python3 -c 'import json; print(json.load(open("plugins/lean-agent/.claude-plugin/plugin.json"))["version"])')
            commit=$(git rev-parse HEAD)
          fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"; exit 0
          fi
          # the release API creates the tag: a tag pushed with the workflow token is refused when the commit
          # changes a workflow file (no `workflows` permission)
          prev=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vx "$tag" | while read -r t; do
            git merge-base --is-ancestor "$t" "$commit" && { echo "$t"; break; }; done || true)
          range="${prev:+$prev..}$commit"
          {
            git log --reverse --no-merges --format='- %s' "$range"
            echo
            echo "Update: lean-agent sync, then lean-agent service restart"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --target "$commit" --title "lean-agent $tag" --notes-file "$RUNNER_TEMP/notes.md"
