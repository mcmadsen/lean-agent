<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>lean-agent</title>
<link rel="stylesheet" href="/ui/style.css?v=__PAGE_VERSION__"></head><body>
<header class="mhead" id="mhead"><div class="mtop"><div class="logo" aria-hidden="true">&gt;_</div><div class="mname"><div class="name">lean-agent</div><span class="live mono" id="mstamp"><span class="dot dot-ok" aria-hidden="true"></span>…</span></div><label class="bb mproj"><span class="sr">Project</span><select id="mproj" aria-label="Project"><option value="">All projects</option></select></label></div><button type="button" class="ustrip" id="mustrip" data-act="plan-graph" title="Show the week's graph" hidden></button></header>
<div class="ws" id="ws">

<!-- LEFT: Chat / Inbox / Todos -->
<aside class="inbox" id="pane-inbox" aria-label="Threads, inbox and todos">
 <div class="brand">
  <div class="logo" aria-hidden="true">&gt;_</div><div class="name">lean-agent</div>
  <span class="hspace"></span><span class="live mono" id="stamp"><span class="dot dot-ok" aria-hidden="true"></span>…</span>
 </div>
 <button type="button" class="ustrip" id="ustrip" data-act="plan-graph" title="Show the week's graph" hidden></button>
 <div class="seg-group ltabs" role="group" aria-label="Views" id="ltabs">
  <button type="button" class="seg on" data-ltab="chat" aria-pressed="true">Chat <span id="n-chat" class="badge"></span></button><button type="button" class="seg" data-ltab="inbox" aria-pressed="false">Inbox <span id="n-inbox"></span></button><button type="button" class="seg" data-ltab="todos" aria-pressed="false">Todos <span id="n-todos"></span></button>
 </div>
 <div class="pad"><label class="picker"><span class="sr">Project</span><select id="bfilter" aria-label="Project"><option value="">All projects</option></select></label></div>
 <section class="ltab" id="l-chat" aria-label="Chat"><div class="thr-top"><form class="ask" data-ask><label class="sr" for="ask-d">Ask Claude anything</label><input type="text" id="ask-d" autocomplete="off" placeholder="Ask Claude anything"><button type="submit" class="btn primary">Ask</button></form><button type="button" class="btn tnew" data-act="new-thread" aria-label="New thread">+</button></div><div class="rows" id="threads"></div></section>
 <section class="ltab" id="l-inbox" aria-label="Inbox" hidden><div class="rows" id="inbox"></div></section>
 <section class="ltab" id="l-todos" aria-label="Todos" hidden><div class="rows" id="todos"></div></section>
</aside>

<!-- RIGHT: the open thread -->
<main class="thread" id="pane-chat" aria-label="Conversation">
 <header class="thead">
  <div class="tbar"><button type="button" class="tsw" id="tbar" data-act="sheet" aria-haspopup="dialog" aria-label="Switch thread"><span id="tbar-t"></span><svg class="chev" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button><button type="button" class="btn tnew" data-act="new-thread" aria-label="New thread">+</button></div>
  <div class="tmeta"><h1 id="ttitle">Main</h1><div class="mono mute sub" id="tsub"></div></div>
  <div class="tacts"><span id="rc" class="chip tone-mute" hidden></span><button id="handled" type="button" class="btn" hidden>Mark handled</button><button id="merge" type="button" class="btn" data-act="merge-open" hidden>Merge…</button></div>
 </header>
 <div id="mergebox" hidden></div>
 <div class="banners" id="banners"></div>
 <div class="stream" id="msgs"></div>
 <div class="composer-wrap">
  <div class="working" id="working" hidden></div>
  <form class="composer" id="chatform">
   <div class="ctx" id="ctxpills"></div>
   <textarea id="chatin" rows="2" aria-label="Message" placeholder="Message (Enter sends, Shift+Enter: new line)"></textarea>
   <div class="cbar">
    <div class="pills" id="cmds"><button type="button" class="pill mono" data-cmd="run">/run</button><button type="button" class="pill mono" data-cmd="review">/review</button><button type="button" class="pill mono" data-cmd="todo">/todo</button><button type="button" class="pill mono" data-cmd="handoff">/handoff</button></div>
    <div class="send"><button type="submit" class="btn primary">Send <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button></div>
   </div>
  </form>
 </div>
</main>
</div>

<!-- phone: the same three tabs, full width -->
<nav class="mtabs" role="group" aria-label="Views" id="mtabs">
 <button type="button" class="seg on" data-ltab="chat" aria-pressed="true">Chat <span id="m-chat" class="badge"></span></button><button type="button" class="seg" data-ltab="inbox" aria-pressed="false">Inbox <span id="m-inbox"></span></button><button type="button" class="seg" data-ltab="todos" aria-pressed="false">Todos <span id="m-todos"></span></button>
</nav>

<nav class="badges" id="badges" aria-label="More"></nav>
<div id="bwrap" hidden><div class="bscrim" data-act="close-badge"></div><section id="bsheet" role="dialog" aria-label="More"></section></div>

<dialog id="sheet" aria-labelledby="sheet-t"><div class="bh"><h2 id="sheet-t">Threads</h2><button type="button" class="btn sm" data-act="close-sheet">Close</button></div><div id="sheetbody"></div><div id="mergesum"></div></dialog>
<dialog id="ask"><form method="dialog"><b id="asktitle"></b><div id="askhint" class="mute small"></div><div id="askextra"></div><textarea id="asktext" rows="3"></textarea>
 <div class="acts"><button class="btn" value="cancel" type="submit" formnovalidate>Cancel</button><button class="btn primary" value="ok" id="askok" type="submit">OK</button></div></form></dialog>
<dialog id="graph"><div class="bh"><h2>Plan usage this week</h2><button type="button" class="btn sm" data-act="close-graph">Close</button></div>
 <div class="legend"><span><i style="border-color:var(--s1)"></i>week</span><span><i style="border-color:var(--s2)"></i>session</span><span><i class="band"></i>session window (5 h, ends at its right edge)</span><span><i style="border-top-style:dashed;border-color:var(--muted)"></i>on pace</span></div>
 <div class="chart"><div id="planchart"></div><div id="ptip"></div></div></dialog>
<div id="view"><div class="bar"><b id="vtitle"></b><span><a id="vdet" href="#">details</a> · <a data-act="close-view" href="#">close</a></span></div><pre id="vbody"></pre></div>
<script src="/ui/app.js?v=__PAGE_VERSION__"></script>
<script src="/ui/chat.js?v=__PAGE_VERSION__"></script>
</body></html>
